# Overlay through FUSE: the kernel overlay is not available to a nested
# rootless user namespace. The storage is under ~/.cache, which den mounts
# from its cache area, so the images stay out of the home backup.
[storage]
driver = "overlay"
rootless_storage_path = "$HOME/.cache/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
