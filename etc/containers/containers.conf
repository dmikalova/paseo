# Nested rootless podman, so that agents can build and run containers. These
# are the settings of quay.io/podman/stable. The outer container already
# gives the network, IPC and UTS isolation, so the inner containers share
# them. The outer container has no systemd and no cgroup delegation.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
# The default sets net.ipv4.ping_group_range, but /proc/sys is read-only in
# the outer container.
default_sysctls = []
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
